name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Phase 4 integration suite (IMP-015): real MySQL 8.4, never a mock.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: ufuq_test
          MYSQL_USER: ufuq_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm run data:verify
      - run: npm run test
      - run: npm run test:reference
      - run: npm run test:integration
        env:
          UFUQ_TEST_MYSQL_URL: mysql://ufuq_test:ci-test-only@127.0.0.1:3306/ufuq_test
      - run: npm run evidence:bkt-sensitivity -- --check
      - run: npm run build
      - run: npm run exports:check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
